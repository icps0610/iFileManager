<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>檔案管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="main">
  <div id="panes"></div>
</main>

<!-- 右側面板：所有選單與操作都集中在這裡，作用在「目前選取的窗格」 -->
<aside id="side" aria-label="操作面板">
  <div class="side-head">
    <div class="brand">檔案管理</div>
    <!-- 設定：原本「檢視」區塊的功能都收在這個下拉面板裡 -->
    <div class="headbtns">
      <!-- 預設只有一個窗格，按這裡開啟／關閉第二個窗格 -->
      <button class="setbtn" data-act="toggleDual" id="b-dualQuick" type="button" aria-pressed="false" title="開啟第二個窗格">＋ 第二窗格</button>
      <button class="setbtn" id="b-settings" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="settingsPanel">⚙ 設定</button>
    </div>
    <div class="settings-panel" id="settingsPanel" role="group" aria-label="設定" hidden>
      <div class="grid g2">
        <button class="btn" data-act="toggleDual" id="b-dual" aria-pressed="true">雙窗格</button>
        <button class="btn" data-act="toggleHidden" id="b-hidden" aria-pressed="false">顯示隱藏檔</button>
        <button class="btn" data-act="toggleDark" id="b-dark" aria-pressed="false">深色模式</button>
        <button class="btn" data-act="newTab" id="b-newtab">新分頁<small>Ctrl+T</small></button>
        <button class="btn dualonly" data-act="swapPanes" id="b-swap">左右互換<small>Ctrl+U</small></button>
        <button class="btn dualonly" data-act="resetSplit" id="b-split">平分寬度<small>雙擊分隔線</small></button>
      </div>
    </div>
  </div>

  <details open data-sec="places" class="first">
    <summary>位置</summary>
    <div class="subhead first">磁碟</div>
    <div class="drvlist" id="drives"></div>
    <div class="subhead" id="quickHead">快速存取</div>
    <div class="grid g2" id="quick"></div>
  </details>

  <div class="card" id="selCard" aria-live="polite">
    <div class="t" id="selTitle"></div>
    <div class="m" id="selMeta"></div>
    <button class="link" id="btnCalc" data-act="calc" hidden>計算資料夾大小</button>
  </div>

  <details open data-sec="nav">
    <summary>導覽</summary>
    <div class="grid g2">
      <button class="btn" data-act="back" id="b-back">返回<small>Alt+←</small></button>
      <button class="btn" data-act="forward" id="b-forward">前進<small>Alt+→</small></button>
      <button class="btn" data-act="up" id="b-up">上一層<small>Backspace</small></button>
      <button class="btn" data-act="refresh">重新整理<small>Ctrl+R</small></button>
    </div>
  </details>

  <details open data-sec="ops">
    <summary>檔案操作</summary>
    <div class="grid g2">
      <button class="btn primary" data-act="open" id="b-open">開啟<small>Enter</small></button>
      <button class="btn" data-act="rename" id="b-rename">重新命名<small>F2</small></button>
      <button class="btn" data-act="batch" id="b-batch">批次改名<small>F3</small></button>
      <button class="btn" data-act="newdir" id="b-newdir">新增資料夾<small>F7</small></button>
      <button class="btn" data-act="copy" id="b-copy">複製<small>Ctrl+C</small></button>
      <button class="btn" data-act="cut" id="b-cut">剪下<small>Ctrl+X</small></button>
      <button class="btn" data-act="paste" id="b-paste">貼上<small>Ctrl+V</small></button>
      <button class="btn" data-act="newfile" id="b-newfile">新增檔案<small>Shift+F7</small></button>
      <button class="btn dualonly" data-act="copyOther" id="b-copyOther">複製到對面<small>F5</small></button>
      <button class="btn dualonly" data-act="moveOther" id="b-moveOther">移到對面<small>F6</small></button>
      <button class="btn danger wide" data-act="trash" id="b-trash">刪除（移到資源回收筒）<small>Del</small></button>
    </div>
    <div class="clipnote" id="clipNote" hidden></div>
  </details>

  <details data-sec="more">
    <summary>更多</summary>
    <div class="grid">
      <button class="btn line" data-act="reveal" id="b-reveal">在 Windows 檔案總管中顯示</button>
      <button class="btn line" data-act="copyPath" id="b-copyPath">複製路徑</button>
      <button class="btn line danger" data-act="deletePerm" id="b-deletePerm">永久刪除（無法復原）<small>Shift+Del</small></button>
      <button class="btn line" data-act="help">快捷鍵說明</button>
    </div>
  </details>
</aside>

<!-- 字級：固定在右下角、尺寸不隨字級縮放，調整時按鈕不會移動 -->
<div id="fontbar" role="group" aria-label="字級">
  <button class="fb" data-act="fontDown" aria-label="縮小字級" title="縮小字級（Ctrl+−）">A−</button>
  <input type="range" id="fontRange" min="14" max="30" step="1" value="18" aria-label="字級" title="拖曳調整字級">
  <button class="fb big" data-act="fontUp" aria-label="放大字級" title="放大字級（Ctrl+＋）">A＋</button>
  <button class="fb num" data-act="fontReset" id="b-font" aria-label="還原字級" title="點擊還原為 18（Ctrl+0）">18</button>
</div>

<div id="modal" role="presentation"></div>
<div id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
